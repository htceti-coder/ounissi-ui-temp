<nav class="sidebar-nav" aria-label="Navigation principale">
  {% for section in nav_sections %}
    <div class="nav-section" data-nav-group="{{ section.key }}">
      <span class="nav-section__title">{{ section.title }}</span>
      {% for item in section.items %}
        <a href="{{ item.url }}" class="nav-link" data-nav-fixed data-nav-key="{{ item.key }}"{% if item.key == 'home' %} data-nav-match="/"{% endif %}{% if item.external %} target="_blank" rel="noopener noreferrer"{% endif %}>
          <span class="nav-icon"><i class="fa {{ item.icon }}" aria-hidden="true"></i></span>
          <span>{{ item.label }}</span>
        </a>
      {% endfor %}
    </div>
  {% endfor %}
  {% if nav_can_configure %}
    <div class="nav-section" data-nav-group="menu-settings">
      <span class="nav-section__title">Paramètres</span>
      <a href="{% url 'configure_navigation' %}" class="nav-link" data-nav-fixed data-nav-key="configure_navigation">
        <span class="nav-icon"><i class="fa fa-sliders" aria-hidden="true"></i></span>
        <span>Configurer le menu</span>
      </a>
    </div>
  {% endif %}
</nav>

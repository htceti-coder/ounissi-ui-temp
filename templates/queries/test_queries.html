{% extends 'base2.html' %}
{% block title %}Tester les requêtes{% endblock %}
{% block content %}
<h1>Tester les requêtes</h1>
<form id="queryForm" method="post" action="{% url 'execute_query' %}" data-details-url="{% url 'get_query_details' 0 %}">
  {% csrf_token %}
  <label for="query">Requête</label>
  <select id="query" name="query" required>
    <option value="">Sélectionner une requête</option>
    {% for query in queries %}<option value="{{ query.id }}">{{ query.name }}</option>{% endfor %}
  </select>
  <div id="parameters"></div>
  <button type="submit" id="submitButton">Exécuter</button>
</form>
<h2 id="queryTitle"></h2>
<div id="queryResults" aria-live="polite"></div>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const querySelect = document.getElementById('query');
    const parameters = document.getElementById('parameters');
    const results = document.getElementById('queryResults');
    const form = document.getElementById('queryForm');
    querySelect.addEventListener('change', async function () {
        const id = querySelect.value;
        parameters.replaceChildren();
        results.replaceChildren();
        document.getElementById('queryTitle').textContent = '';
        if (!id) return;
        try {
            const response = await fetch(form.dataset.detailsUrl.replace(/0\/$/, id + '/'));
            if (!response.ok) throw new Error('Impossible de charger les paramètres.');
            const data = await response.json();
            if (querySelect.value !== id) return;
            data.parameters.forEach(parameter => {
                const label = document.createElement('label');
                label.textContent = parameter.name;
                const input = document.createElement('input');
                input.type = 'text';
                input.name = parameter.name;
                input.value = parameter.value == null ? '' : String(parameter.value);
                label.appendChild(input);
                parameters.appendChild(label);
            });
        } catch (error) {
            if (querySelect.value === id) parameters.textContent = error.message;
        }
    });
    form.addEventListener('submit', async function (event) {
        event.preventDefault();
        if (!querySelect.value) return;
        document.getElementById('queryTitle').textContent = 'Résultats : ' + querySelect.selectedOptions[0].textContent;
        results.textContent = 'Chargement…';
        showLoadingContainer();
        try {
            const response = await fetch(form.action, { method: 'POST', body: new FormData(form) });
            if (!response.ok) throw new Error('Impossible d’exécuter la requête.');
            results.innerHTML = await response.text();
        } catch (error) {
            results.textContent = error.message || 'Impossible de contacter le serveur.';
        } finally {
            hideLoadingContainer();
        }
    });
});
</script>
{% endblock %}

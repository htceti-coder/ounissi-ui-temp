<div class="kpi-builder-field{% if field.errors %} kpi-builder-field--invalid{% endif %}">
  {{ field.label_tag }}
  {{ field }}
  {% if field.help_text %}<p class="kpi-builder-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<div id="{{ field.auto_id }}_error" role="alert">{% for error in field.errors %}<p class="kpi-builder-error">{{ error }}</p>{% endfor %}</div>{% endif %}
</div>
